<script>
'use strict';
const APP_VERSION='1.2.1';

const KEY='moyo-vremya-data-v1';
const COLORS=['#f6a83c','#b6d2a4','#87b9c8','#d9a1a0','#c7b4db','#dfca81'];
const icons={
 settings:'<path d="M4 7h16M4 17h16M8 4v6M16 14v6"/>',left:'<path d="m14 6-6 6 6 6"/>',right:'<path d="m10 6 6 6-6 6"/>',plus:'<path d="M12 5v14M5 12h14"/>',timer:'<circle cx="12" cy="13" r="7.5"/><path d="M12 8.5V13l3 2M9 2h6M12 3v2.5"/>',stats:'<path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/>',play:'<path d="m8 5 11 7-11 7z" fill="currentColor" stroke="none"/>',pause:'<path d="M8 5v14M16 5v14" stroke-width="3"/>',save:'<path d="M4 13v5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5M12 3v11m-4-4 4 4 4-4"/>',more:'<circle cx="12" cy="5" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="19" r="1" fill="currentColor"/>',close:'<path d="M6 6l12 12M18 6 6 18"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/>',trash:'<path d="M4 7h16M9 4h6M6 7l1 13h10l1-13M10 11v5M14 11v5"/>',reset:'<path d="M4 10a8 8 0 1 1 1 7M4 4v6h6"/>',export:'<path d="M12 15V3m-4 4 4-4 4 4M4 15v4h16v-4"/>',import:'<path d="M12 3v12m-4-4 4 4 4-4M4 17v3h16v-3"/>',manual:'<path d="M12 3v18M3 12h18"/>',check:'<path d="m4 12 5 5L20 6"/>'};
function icon(name,size=18){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||''}</svg>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(){return (globalThis.crypto&&crypto.randomUUID)?crypto.randomUUID():'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}
function dayKey(d=new Date()){const a=new Date(d);return `${a.getFullYear()}-${String(a.getMonth()+1).padStart(2,'0')}-${String(a.getDate()).padStart(2,'0')}`}
function dayStart(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const d=dayStart(s);d.setDate(d.getDate()+n);return dayKey(d)}
function dateLabel(s,opts={day:'numeric',month:'long'}){return new Intl.DateTimeFormat('ru-RU',opts).format(dayStart(s))}
function niceDay(s){const today=dayKey();if(s===today)return 'Сегодня';if(s===addDays(today,-1))return 'Вчера';if(s===addDays(today,1))return 'Завтра';return dateLabel(s,{day:'numeric',month:'long'})}
function duration(ms,seconds=false){ms=Math.max(0,Number(ms)||0);const total=Math.floor(ms/1000),h=Math.floor(total/3600),m=Math.floor(total/60)%60,s=total%60;if(seconds)return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;if(h===0&&m===0)return total?`${s} сек`:'0 мин';return `${h?h+' ч ':''}${m||!h?m+' мин':''}`.trim()}
function elapsed(t,now=Date.now()){return t.segments.reduce((n,a)=>n+Math.max(0,a[1]-a[0]),0)+(t.runningSince==null?0:Math.max(0,now-t.runningSince))}
function defaults(){return {version:1,timers:[['Работа','Общее',0],['Бодрствую','Общее',1],['Хожу','Общее',2],['Сижу','Общее',3],['Стою','Общее',4],['Лежу','Общее',5],['Открытое окно','Воздух',2],['Закрытое окно','Воздух',1],['Силовая зарядка','Спорт',0],['Лёгкая зарядка','Спорт',4],['Еда','Еда',5]].map(([name,group,c])=>({id:uid(),name,group,color:COLORS[c],runningSince:null,segments:[]})),entries:[]}}
let storageOK=true;
function readState(){try{const s=localStorage.getItem(KEY);if(!s)return defaults();const parsed=JSON.parse(s);if(!validState(parsed))throw new Error('invalid');return parsed}catch(e){storageOK=false;return defaults()}}
let state=readState(), ui={view:'timers',day:dayKey(),group:null,period:'day',from:dayKey(),to:dayKey(),modal:null};
function saveState(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;document.getElementById('storage-warning').innerHTML='';return true}catch(e){storageOK=false;document.getElementById('storage-warning').innerHTML='<div class="storage-alert">Не удалось сохранить данные на устройстве. Проверьте настройки браузера или откройте приложение в обычной вкладке.</div>';return false}}
function validDay(s){if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;const [y,m,d]=s.split('-').map(Number);return y>=1970&&y<=9999&&m>=1&&m<=12&&d>=1&&d<=31&&dayKey(dayStart(s))===s}
function validState(s){if(!s||s.version!==1||!Array.isArray(s.timers)||!Array.isArray(s.entries))return false;const isStr=x=>typeof x==='string'&&x.length<=200;const validSegs=x=>Array.isArray(x)&&x.every(a=>Array.isArray(a)&&a.length===2&&Number.isFinite(a[0])&&Number.isFinite(a[1])&&a[1]>=a[0]);return s.timers.every(t=>t&&isStr(t.id)&&isStr(t.name)&&isStr(t.group)&&/^#[0-9a-fA-F]{6}$/.test(t.color)&&validSegs(t.segments)&&(t.runningSince===null||Number.isFinite(t.runningSince)))&&s.entries.every(e=>e&&isStr(e.id)&&isStr(e.timerId)&&isStr(e.name)&&isStr(e.group)&&/^#[0-9a-fA-F]{6}$/.test(e.color)&&((validSegs(e.segments))||(validDay(e.manualDay)&&Number.isFinite(e.manualMs)&&e.manualMs>0)))}
function persist(){saveState();render()}
function toast(message){const n=document.getElementById('toast-root');n.innerHTML=`<div class="toast">${esc(message)}</div>`;clearTimeout(toast.timeout);toast.timeout=setTimeout(()=>n.innerHTML='',2600)}
function currentBounds(){let from=ui.day,to=ui.day;if(ui.period==='week'){const x=dayStart(ui.day),day=x.getDay()||7;from=addDays(ui.day,1-day);to=addDays(from,6)}else if(ui.period==='month'){const x=dayStart(ui.day);from=dayKey(new Date(x.getFullYear(),x.getMonth(),1));to=dayKey(new Date(x.getFullYear(),x.getMonth()+1,0))}else if(ui.period==='range'){from=ui.from;to=ui.to}return {from,to}}
function rangeMs(from,to){return [dayStart(from).getTime(),dayStart(addDays(to,1)).getTime()]}
function entryInRange(e,from,to){if(e.manualDay)return e.manualDay>=from&&e.manualDay<=to?e.manualMs:0;const [start,end]=rangeMs(from,to);return e.segments.reduce((n,[a,b])=>n+Math.max(0,Math.min(end,b)-Math.max(start,a)),0)}
function byTimer(from,to){const m=new Map();for(const e of state.entries){const ms=entryInRange(e,from,to);if(!ms)continue;let k=e.timerId;let x=m.get(k);if(!x){const t=state.timers.find(t=>t.id===k);x={id:k,name:t?.name||e.name,group:t?.group||e.group,color:t?.color||e.color,ms:0};m.set(k,x)}x.ms+=ms}return [...m.values()].sort((a,b)=>b.ms-a.ms)}
function totalRange(from,to){return state.entries.reduce((n,e)=>n+entryInRange(e,from,to),0)}
function rangeLabel(from,to){return from===to?dateLabel(from,{day:'numeric',month:'long',year:'numeric'}):`${dateLabel(from)} — ${dateLabel(to,{day:'numeric',month:'long',year:'numeric'})}`}
function rangeDayCount(from,to){let n=0,x=from;while(x<=to&&n<=32){n++;x=addDays(x,1)}return n}
function renderDate(){document.getElementById('date-title').textContent=niceDay(ui.day);document.getElementById('date-subtitle').textContent=dateLabel(ui.day,{weekday:'long',day:'numeric',month:'long',year:'numeric'});document.getElementById('selected-date').value=ui.day;document.getElementById('today-btn').classList.toggle('hidden',ui.day===dayKey());document.getElementById('network-status').textContent=navigator.onLine?'Данные на устройстве':'Нет сети · всё работает'}
function groups(){return [...new Set(state.timers.map(t=>t.group))]}
function renderTimers(){
 const available=groups();
 if(!available.includes(ui.group))ui.group=available[0]||null;
 const visible=state.timers.filter(t=>t.group===ui.group),sum=totalRange(ui.day,ui.day),now=Date.now();
 return `<section class="summary"><div><div class="eyebrow">ВАШ ЛИЧНЫЙ УЧЁТ</div><h1>Мои таймеры<span style="color:var(--accent)">.</span></h1></div><div class="summary-side"><strong>${duration(sum)}</strong><small>сохранено ${ui.day===dayKey()?'сегодня':'за день'}</small></div></section>
 <div class="tabs-scroll" aria-label="Группы">${available.map(g=>`<button class="chip ${ui.group===g?'active':''}" data-group="${esc(g)}">${esc(g)}</button>`).join('')}</div>
 <div class="list-head"><span>${esc(ui.group||'Таймеры')} · ${visible.length}</span><button class="add-text" data-action="add-timer">${icon('plus',15)} Добавить</button></div>
 <div class="timer-list">${visible.length?visible.map(t=>{
  const v=elapsed(t,now),d=state.entries.filter(e=>e.timerId===t.id).reduce((n,e)=>n+entryInRange(e,ui.day,ui.day),0);
  return `<article class="timer-card ${t.runningSince!==null?'running':''}" style="--timer-color:${esc(t.color)}"><div class="timer-head"><span class="dot"></span><span class="timer-name">${esc(t.name)}</span><span class="timer-status ${t.runningSince!==null?'live':''}">${t.runningSince!==null?'● ИДЁТ':'НА ПАУЗЕ'}</span><button class="menu-btn" data-menu="${esc(t.id)}" aria-label="Действия: ${esc(t.name)}">${icon('more',21)}</button></div>
  <div class="time-row"><div class="clock" data-clock="${esc(t.id)}">${duration(v,true)}</div><div class="counted">за ${ui.day===dayKey()?'сегодня':'день'}<b>${duration(d)}</b></div></div>
  <div class="timer-actions"><button class="action ${t.runningSince!==null?'pause-action':'primary-action'}" data-toggle="${esc(t.id)}">${icon(t.runningSince!==null?'pause':'play',16)} ${t.runningSince!==null?'Пауза':'Старт'}</button><button class="action save-action" data-save="${esc(t.id)}" ${v<1000?'disabled':''}>${icon('save',16)} Сохранить</button><button class="action reset-action" data-reset="${esc(t.id)}" title="Сбросить без сохранения" aria-label="Сбросить без сохранения: ${esc(t.name)}">${icon('reset',16)}</button></div></article>`;
 }).join(''):`<div class="empty"><strong>Пока нет таймеров</strong><p>Добавьте таймер для работы, прогулок или любого другого занятия.</p></div>`}</div><p class="note">Время попадёт в статистику после нажатия «Сохранить». Таймеры могут идти одновременно.</p>`;
}
function switchGroup(direction){
 const available=groups(),index=available.indexOf(ui.group),next=index+direction;
 if(index<0||next<0||next>=available.length)return;
 ui.group=available[next];render();
 document.querySelector('.chip.active')?.scrollIntoView({block:'nearest',inline:'nearest'});
}
let groupGesture=null,swipeClickUntil=0;
const groupContent=document.getElementById('content');
groupContent.addEventListener('touchstart',e=>{
 groupGesture=null;
 if(ui.view!=='timers'||ui.modal||e.touches.length!==1||e.target.closest('input,select,textarea'))return;
 const touch=e.touches[0];
 groupGesture={id:touch.identifier,x:touch.clientX,y:touch.clientY,axis:null,handled:false};
 },{passive:true});
groupContent.addEventListener('touchmove',e=>{
 if(!groupGesture)return;
 const touch=Array.from(e.touches).find(t=>t.identifier===groupGesture.id);
 if(e.touches.length!==1||!touch||ui.view!=='timers'||ui.modal){groupGesture=null;return}
 const dx=touch.clientX-groupGesture.x,dy=touch.clientY-groupGesture.y;
 if(!groupGesture.axis){
  if(Math.max(Math.abs(dx),Math.abs(dy))<10)return;
  if(Math.abs(dy)>Math.abs(dx)*1.2){groupGesture=null;return}
  if(Math.abs(dx)>Math.abs(dy)*1.2)groupGesture.axis='x';
 }
 if(groupGesture.axis!=='x')return;
 if(e.cancelable)e.preventDefault();
 if(groupGesture.handled||Math.abs(dx)<50)return;
 groupGesture.handled=true;
 swipeClickUntil=Date.now()+600;
 switchGroup(dx<0?1:-1);
},{passive:false});
groupContent.addEventListener('touchend',e=>{
 const start=groupGesture;groupGesture=null;
 if(!start||start.handled||ui.view!=='timers'||ui.modal)return;
 const touch=Array.from(e.changedTouches).find(t=>t.identifier===start.id);
 if(!touch)return;
 const dx=touch.clientX-start.x,dy=touch.clientY-start.y;
 if(Math.abs(dx)<50||Math.abs(dx)<Math.abs(dy)*1.2)return;
 if(e.cancelable)e.preventDefault();
 swipeClickUntil=Date.now()+600;
 switchGroup(dx<0?1:-1);
},{passive:false});
groupContent.addEventListener('touchcancel',()=>{groupGesture=null},{passive:true});
groupContent.addEventListener('click',e=>{
 if(Date.now()<swipeClickUntil){e.preventDefault();e.stopImmediatePropagation()}
},true);
function renderStats(){const {from,to}=currentBounds();const invalid=from>to;const rows=invalid?[]:byTimer(from,to),sum=rows.reduce((n,r)=>n+r.ms,0),items=invalid?[]:state.entries.map(e=>({e,ms:entryInRange(e,from,to)})).filter(x=>x.ms>0).sort((a,b)=>(b.e.manualDay?dayStart(b.e.manualDay).getTime():Math.max(...b.e.segments.map(s=>s[1]),0))-(a.e.manualDay?dayStart(a.e.manualDay).getTime():Math.max(...a.e.segments.map(s=>s[1]),0)));let chart='';if(!invalid&&rangeDayCount(from,to)<=31){let ds=[],d=from;while(d<=to){ds.push({day:d,ms:totalRange(d,d)});d=addDays(d,1)}const max=Math.max(1,...ds.map(x=>x.ms)),dense=ds.length>14;chart=`<section class="stats-section"><div class="section-title"><h2>По дням</h2><span>${esc(rangeLabel(from,to))}</span></div><div class="chart" role="img" aria-label="Время по дням">${ds.map((x,i)=>`<div class="chart-col ${x.day===ui.day?'selected':''}" title="${esc(dateLabel(x.day))}: ${esc(duration(x.ms))}"><div class="bar-wrap"><div class="bar" style="height:${x.ms?Math.max(3,Math.round(x.ms/max*100)):2}%"></div></div><span>${!dense||i===0||i===ds.length-1||i%5===0?dayStart(x.day).getDate():''}</span></div>`).join('')}</div></section>`}
return `<section class="summary"><div><div class="eyebrow">ВАШИ СОХРАНЁННЫЕ ЗАПИСИ</div><h1>Статистика<span style="color:var(--accent)">.</span></h1></div><button class="add-text" data-action="manual">${icon('plus',15)} Добавить время</button></section><div class="segmented">${[['day','День'],['week','Неделя'],['month','Месяц'],['range','Период']].map(([v,l])=>`<button data-period="${v}" class="${ui.period===v?'active':''}">${l}</button>`).join('')}</div>${ui.period==='range'?`<div class="range-box"><label>С <input type="date" data-range="from" value="${esc(ui.from)}"></label><label>По <input type="date" data-range="to" value="${esc(ui.to)}"></label></div>`:''}${invalid?'<div class="range-warning">Дата начала должна быть раньше даты окончания.</div>':''}<div class="stat-hero"><div class="eyebrow">${invalid?'ВЫБЕРИТЕ ПЕРИОД':esc(rangeLabel(from,to))}</div><strong>${duration(sum)}</strong><p>Сумма сохранённых таймеров · ${items.length} ${items.length===1?'запись':items.length>1&&items.length<5?'записи':'записей'}</p></div>${chart}<section class="stats-section"><div class="section-title"><h2>По таймерам</h2><span>${rows.length} ${rows.length===1?'таймер':'таймеров'}</span></div><div class="stat-list">${rows.length?rows.map(x=>`<div class="stat-item" style="--timer-color:${esc(x.color)}"><div class="stat-top"><span class="dot"></span><div class="name">${esc(x.name)}<small>${esc(x.group)}</small></div><strong>${duration(x.ms)}</strong></div><div class="track"><div style="width:${sum?Math.max(2,x.ms/sum*100):0}%"></div></div></div>`).join(''):'<div class="empty"><strong>Здесь пока пусто</strong><p>Запустите таймер и сохраните время, чтобы оно появилось в статистике.</p></div>'}</div></section>${items.length?`<section class="stats-section"><div class="section-title"><h2>Записи</h2><span>за выбранный период</span></div><div class="entry-list">${items.map(({e,ms})=>`<div class="entry"><span class="dot" style="--timer-color:${esc(e.color)}"></span><div class="entry-info"><strong>${esc(e.name)}</strong><small>${e.manualDay?'Вручную · '+esc(dateLabel(e.manualDay,{day:'numeric',month:'short'})):esc(entryDescription(e,from,to))}</small></div><span class="entry-duration">${duration(ms)}</span><button class="entry-delete" data-delete-entry="${esc(e.id)}" aria-label="Удалить запись ${esc(e.name)}">${icon('trash',17)}</button></div>`).join('')}</div></section>`:''}<p class="note">В статистику попадает только сохранённое время. Если таймеры шли одновременно, их время суммируется.</p>`}
function entryDescription(e,from,to){const first=e.segments[0]?.[0],last=e.segments[e.segments.length-1]?.[1];if(first==null)return 'Сохранено';const fmt=x=>new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(x));return `${fmt(first)} — ${fmt(last)}`}
function render(){renderDate();document.getElementById('content').innerHTML=ui.view==='timers'?renderTimers():renderStats();document.getElementById('timers-nav').classList.toggle('active',ui.view==='timers');document.getElementById('stats-nav').classList.toggle('active',ui.view==='stats');document.getElementById('fab').classList.toggle('hidden',ui.view!=='timers');if(!storageOK)document.getElementById('storage-warning').innerHTML='<div class="storage-alert">Не удалось прочитать данные на устройстве. Не закрывайте страницу, пока не проверите настройки браузера.</div>'}
function openModal(title,body){ui.modal=true;document.getElementById('modal-root').innerHTML=`<div class="overlay" data-overlay><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-head"><h2>${esc(title)}</h2><button class="close" data-close aria-label="Закрыть">${icon('close',18)}</button></div>${body}</div></div>`}
function closeModal(){ui.modal=false;document.getElementById('modal-root').innerHTML=''}
function timerForm(t){const isNew=!t;let c=t?.color||COLORS[state.timers.length%COLORS.length];const groupNames=groups();openModal(isNew?'Новый таймер':'Изменить таймер',`<form id="timer-form" data-id="${esc(t?.id||'')}"><label class="field">Название<input name="name" maxlength="80" required autocomplete="off" placeholder="Например, прогулка" value="${esc(t?.name||'')}"></label><label class="field">Группа<input name="group" maxlength="60" required list="group-options" autocomplete="off" placeholder="Например, Общее" value="${esc(t?.group||ui.group||'Общее')}"><datalist id="group-options">${groupNames.map(g=>`<option value="${esc(g)}">`).join('')}</datalist></label><div class="field">Цвет</div><div class="color-row">${COLORS.map(x=>`<button type="button" class="color-choice ${x===c?'selected':''}" data-color="${x}" style="--c:${x}" aria-label="Выбрать цвет"></button>`).join('')}</div><input type="hidden" name="color" value="${c}"><div class="sheet-actions"><button class="primary" type="submit">${isNew?'Создать таймер':'Сохранить изменения'}</button></div></form>`);setTimeout(()=>document.querySelector('#timer-form input[name=name]')?.focus(),80)}
function menuTimer(id){const t=state.timers.find(t=>t.id===id);if(!t)return;openModal(t.name,`<button class="option" data-edit="${esc(id)}">${icon('edit')} Изменить таймер</button><button class="option" data-reset="${esc(id)}">${icon('reset')} Сбросить несохранённое время</button><button class="option danger-text" data-delete-timer="${esc(id)}">${icon('trash')} Удалить таймер</button><p class="help">Сохранённая статистика останется при удалении таймера.</p>`)}
function settings(){openModal('Данные и настройки',`<button class="option" data-action="export">${icon('export')}<span>Скачать резервную копию<small>Все таймеры и записи в файле JSON</small></span></button><button class="option" data-action="import">${icon('import')}<span>Восстановить из файла<small>Заменит текущие данные</small></span></button><button class="option" data-action="csv">${icon('stats')}<span>Выгрузить статистику CSV<small>Можно открыть в таблицах</small></span></button><p class="help">Данные хранятся только в этом браузере на устройстве. Сделайте резервную копию перед очисткой данных браузера или сменой телефона.</p><p class="help">Таймеры продолжают отсчёт по часам устройства, даже если приложение закрыто. Чтобы время попало в статистику, нажмите «Сохранить».</p><p class="help">Это автономный HTML-файл. Открывайте его в одном и том же браузере, чтобы видеть сохранённые данные.</p>`)}
function manualForm(){if(!state.timers.length){toast('Сначала создайте таймер');return}openModal('Добавить время',`<form id="manual-form"><label class="field">Таймер<select name="timerId" required>${state.timers.map(t=>`<option value="${esc(t.id)}">${esc(t.name)} · ${esc(t.group)}</option>`).join('')}</select></label><label class="field">День<input name="day" type="date" required value="${esc(ui.day)}"></label><div style="display:flex;gap:12px"><label class="field" style="flex:1">Часы<input name="hours" type="number" min="0" max="99999" value="0" inputmode="numeric" required></label><label class="field" style="flex:1">Минуты<input name="minutes" type="number" min="0" max="59" value="0" inputmode="numeric" required></label></div><p class="help">Запись будет добавлена в статистику за выбранный день.</p><button type="submit" class="primary" style="width:100%">Добавить запись</button></form>`)}
function downloadFile(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function exportData(){downloadFile(`moyo-vremya-${dayKey()}.json`,JSON.stringify(state,null,2),'application/json');toast('Резервная копия скачана')}
function exportCSV(){const lines=[['Дата','Таймер','Группа','Длительность, секунд']];for(const e of state.entries){if(e.manualDay)lines.push([e.manualDay,e.name,e.group,Math.round(e.manualMs/1000)]);else for(const [start,end] of e.segments){let cursor=start;while(cursor<end){const key=dayKey(new Date(cursor)),next=dayStart(addDays(key,1)).getTime(),stop=Math.min(end,next);if(stop<=cursor)break;lines.push([key,e.name,e.group,Math.round((stop-cursor)/1000)]);cursor=stop}}}const csv=lines.map(row=>row.map(x=>'"'+String(x).replace(/^[=+\-@]/,"'$&").replace(/"/g,'""')+'"').join(';')).join('\r\n');downloadFile(`moyo-vremya-statistika-${dayKey()}.csv`,'\ufeff'+csv,'text/csv;charset=utf-8');toast('Статистика скачана')}
function tick(){if(ui.view!=='timers')return;const now=Date.now();for(const t of state.timers){if(t.runningSince===null)continue;const el=document.querySelector(`[data-clock="${CSS.escape(t.id)}"]`);if(el)el.textContent=duration(elapsed(t,now),true);const btn=document.querySelector(`[data-save="${CSS.escape(t.id)}"]`);if(btn&&elapsed(t,now)>=1000)btn.disabled=false}}
function navigateDay(n){ui.day=addDays(ui.day,n);render()}
document.getElementById('settings-btn').innerHTML=icon('settings',20);document.querySelector('[data-date-nav="-1"]').innerHTML=icon('left',19);document.querySelector('[data-date-nav="1"]').innerHTML=icon('right',19);document.getElementById('fab').innerHTML=icon('plus',25);document.getElementById('timers-nav').innerHTML=icon('timer',19)+' Таймеры';document.getElementById('stats-nav').innerHTML=icon('stats',19)+' Статистика';
document.addEventListener('click',e=>{const b=e.target.closest('button');if(e.target.matches('[data-overlay]')){closeModal();return}if(!b)return;if(b.hasAttribute('data-close')){closeModal();return}if(b.dataset.dateNav){navigateDay(Number(b.dataset.dateNav));return}if(b.id==='today-btn'){ui.day=dayKey();render();return}if(b.id==='settings-btn'){settings();return}if(b.id==='fab'||b.dataset.action==='add-timer'){timerForm();return}if(b.dataset.view){ui.view=b.dataset.view;render();return}if(b.dataset.group){ui.group=b.dataset.group;render();return}if(b.dataset.period){ui.period=b.dataset.period;if(ui.period==='range'&&ui.from===ui.to){ui.from=addDays(ui.day,-6);ui.to=ui.day}render();return}if(b.dataset.menu){menuTimer(b.dataset.menu);return}if(b.dataset.edit){const t=state.timers.find(t=>t.id===b.dataset.edit);timerForm(t);return}if(b.dataset.toggle){const t=state.timers.find(t=>t.id===b.dataset.toggle);if(!t)return;const now=Date.now();if(t.runningSince!==null){if(now>t.runningSince)t.segments.push([t.runningSince,now]);t.runningSince=null}else t.runningSince=now;persist();return}if(b.dataset.save){const t=state.timers.find(t=>t.id===b.dataset.save);if(!t)return;const now=Date.now(),segments=t.segments.map(x=>x.slice());if(t.runningSince!==null&&now>t.runningSince)segments.push([t.runningSince,now]);if(!segments.length||elapsed(t,now)<1000)return;state.entries.push({id:uid(),timerId:t.id,name:t.name,group:t.group,color:t.color,segments,createdAt:now});t.segments=[];if(t.runningSince!==null)t.runningSince=now;persist();toast('Время сохранено в статистику');return}if(b.dataset.reset){const t=state.timers.find(t=>t.id===b.dataset.reset);if(t&&confirm('Сбросить несохранённое время этого таймера?')){t.segments=[];if(t.runningSince!==null)t.runningSince=Date.now();closeModal();persist();toast('Время сброшено')}return}if(b.dataset.deleteTimer){const t=state.timers.find(t=>t.id===b.dataset.deleteTimer);if(t&&confirm('Удалить таймер? Его несохранённое время будет потеряно, статистика останется.')){state.timers=state.timers.filter(x=>x.id!==t.id);closeModal();persist();toast('Таймер удалён')}return}if(b.dataset.deleteEntry){if(confirm('Удалить эту запись целиком? Если она захватывает несколько дней, она исчезнет из статистики всех этих дней.')){state.entries=state.entries.filter(x=>x.id!==b.dataset.deleteEntry);persist();toast('Запись удалена')}return}if(b.dataset.color){document.querySelectorAll('.color-choice').forEach(x=>x.classList.toggle('selected',x===b));document.querySelector('#timer-form input[name=color]').value=b.dataset.color;return}if(b.dataset.action==='manual'){manualForm();return}if(b.dataset.action==='export'){closeModal();exportData();return}if(b.dataset.action==='import'){closeModal();document.getElementById('import-file').click();return}if(b.dataset.action==='csv'){closeModal();exportCSV();return}});
document.addEventListener('change',e=>{if(e.target.id==='selected-date'&&validDay(e.target.value)){ui.day=e.target.value;render()}if(e.target.dataset.range&&validDay(e.target.value)){ui[e.target.dataset.range]=e.target.value;render()}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,fd=new FormData(f);if(f.id==='timer-form'){const name=String(fd.get('name')).trim(),group=String(fd.get('group')).trim(),color=String(fd.get('color'));if(!name||!group||!COLORS.includes(color)){toast('Укажите название и группу');return}const old=state.timers.find(t=>t.id===f.dataset.id);if(old)Object.assign(old,{name,group,color});else{state.timers.push({id:uid(),name,group,color,runningSince:null,segments:[]});ui.group=group}closeModal();persist();toast(old?'Таймер изменён':'Таймер создан')}if(f.id==='manual-form'){const t=state.timers.find(x=>x.id===fd.get('timerId')),day=String(fd.get('day')),h=Number(fd.get('hours')),m=Number(fd.get('minutes'));if(!t||!validDay(day)||!Number.isInteger(h)||h<0||h>99999||!Number.isInteger(m)||m<0||m>59||(h===0&&m===0)){toast('Укажите день и время больше нуля');return}state.entries.push({id:uid(),timerId:t.id,name:t.name,group:t.group,color:t.color,manualDay:day,manualMs:(h*60+m)*60000,createdAt:Date.now()});closeModal();persist();toast('Время добавлено в статистику')}});

window.addEventListener('online',renderDate);window.addEventListener('offline',renderDate);document.addEventListener('visibilitychange',()=>{if(!document.hidden){render();tick()}});
if(location.protocol==='https:'&&'serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
document.addEventListener('pointerdown',()=>{if(navigator.storage?.persist)navigator.storage.persist().catch(()=>{})},{once:true});
if(storageOK)saveState();render();setInterval(tick,250);
